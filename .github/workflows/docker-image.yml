name: Docker image

on:
  pull_request:
    branches:
      - develop
      - main
      - "dev-v*"
    paths:
      - "docker/**"
      - ".devcontainer/**"
      - ".github/workflows/docker-image.yml"

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: build all-in-one runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose -f docker/compose.yaml build dev

      - name: Check runtimes (Node 24 / Bun / Go 1.26 / PHP)
        run: docker compose -f docker/compose.yaml run --rm --no-deps dev check-runtimes
