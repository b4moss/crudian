name: Docker image

# Run on PRs into develop / dev-*.
# Same docker-related content that already passed is skipped via GHA cache marker.
# Image layers are cached with buildx GHA cache when a build does run.

on:
  pull_request:
    branches:
      - develop
      - "dev-*"
    paths:
      - "docker/**"
      - ".devcontainer/**"
      - ".github/workflows/docker-image.yml"

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: build all-in-one runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      IMAGE_TAG: crudian-dev:local
      PASS_MARKER: .ci/docker-check-passed
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Restore pass marker
        id: pass-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PASS_MARKER }}
          key: docker-check-passed-${{ hashFiles('docker/**', '.devcontainer/**', '.github/workflows/docker-image.yml') }}

      - name: Skip notice
        if: steps.pass-cache.outputs.cache-hit == 'true'
        run: echo "Docker check already passed for this content hash; skipping build."

      - name: Set up Docker Buildx
        if: steps.pass-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Build image
        if: steps.pass-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: docker
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            NODE_MAJOR=24
            GO_VERSION=1.26.7
          cache-from: type=gha,scope=crudian-dev
          cache-to: type=gha,mode=max,scope=crudian-dev

      - name: Check runtimes (Node 24 / Bun / Go 1.26 / PHP)
        if: steps.pass-cache.outputs.cache-hit != 'true'
        run: docker compose -f docker/compose.yaml run --rm --no-deps dev check-runtimes

      - name: Mark passed
        if: steps.pass-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$PASS_MARKER")"
          date -u +"passed %Y-%m-%dT%H:%M:%SZ" > "$PASS_MARKER"
