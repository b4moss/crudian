name: Publish npm

# Deploys @b4moss/crudian only when packages/js version/tag/content warrants it.
# See .github/CI.md

on:
  push:
    branches:
      - release

concurrency:
  group: publish-npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish @b4moss/crudian
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('packages/js/bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install dependencies
        working-directory: packages/js
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/js
        run: bun run build

      - name: Decide whether to publish
        id: decide
        run: bash .github/scripts/should-publish-crudian.sh

      - name: Test bun-sqlite
        if: steps.decide.outputs.skip != 'true'
        working-directory: packages/js
        run: bun test src/bun-sqlite

      - name: Test drizzle
        if: steps.decide.outputs.skip != 'true'
        working-directory: packages/js
        run: bun run test:drizzle

      - name: Test prisma
        if: steps.decide.outputs.skip != 'true'
        working-directory: packages/js
        run: bun run test:prisma

      - name: Test libsql
        if: steps.decide.outputs.skip != 'true'
        working-directory: packages/js
        run: bun run test:libsql

      - name: Publish to npm
        if: steps.decide.outputs.skip != 'true'
        working-directory: packages/js
        run: npm publish --access public --provenance
